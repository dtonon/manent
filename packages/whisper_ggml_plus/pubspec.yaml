name: whisper_ggml_plus
description: Whisper.cpp Flutter FFI plugin, vendored from DDULDDUCK/whisper_ggml_plus. See VENDORED.md.
version: 1.5.2
publish_to: none

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter

  ffi: ^2.1.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.10.0
  plugin_platform_interface: ^2.1.8
  universal_io: ^2.3.1
  flutter_riverpod: '>=2.6.1 <4.0.0'
  path_provider: ^2.1.5

dev_dependencies:
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.12.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/ggml-silero-v6.2.0.bin
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
        sharedDarwinSource: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
        sharedDarwinSource: true
      windows:
        ffiPlugin: true
