name: opus_decode
description: Ogg Opus decoding to PCM over FFI, with libopus compiled from vendored source by a Dart build hook.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.0
  hooks: '>=2.0.2 <3.0.0'
  code_assets: ^1.2.1
  native_toolchain_c: '>=0.19.2 <0.20.0'
