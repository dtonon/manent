name: windows-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Flutter publishes no Windows ARM64 SDK, so only x64 can be built.
# ARM users run the x64 build via the built-in Prism emulation.
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      # Runtime CPU dispatch needs the ggml core DLLs and the CPU variants next
      # to the whisper plugin
      - name: Check whisper plugin bundle
        shell: bash
        run: |
          RELEASE_DIR=$(ls -d build/windows/*/runner/Release)
          ls "$RELEASE_DIR"/ggml.dll "$RELEASE_DIR"/ggml-base.dll "$RELEASE_DIR"/whisper_ggml_plus.dll
          ls "$RELEASE_DIR"/ggml-cpu-*.dll

      - name: Package
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          RELEASE_DIR=$(ls -d build/windows/*/runner/Release)
          cd "$RELEASE_DIR"
          7z a "$GITHUB_WORKSPACE/manent-$VERSION-windows-x64.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: manent-windows-x64
          path: manent-*-windows-x64.zip

