name: linux-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Flutter publishes no Linux ARM64 SDK, so only x64 can be built.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        timeout-minutes: 10
        run: |
          # The Azure apt mirror stalls apt for the whole job when unhealthy
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev \
            libmpv-dev libepoxy-dev \
            rpm
          sudo gem install fpm

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - run: flutter pub get

      - run: flutter build linux --release

      - name: Package
        run: |
          BUNDLE_DIR=$(ls -d build/linux/*/release/bundle)
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)

          tar -czf "manent-$VERSION-linux-x64.tar.gz" -C "$BUNDLE_DIR" .

          mkdir -p pkg/usr/lib/manent pkg/usr/bin \
            pkg/usr/share/applications pkg/usr/share/icons/hicolor/1024x1024/apps
          cp -r "$BUNDLE_DIR"/. pkg/usr/lib/manent/
          ln -s ../lib/manent/manent pkg/usr/bin/manent
          cp linux/packaging/manent.desktop pkg/usr/share/applications/
          cp assets/icon.png pkg/usr/share/icons/hicolor/1024x1024/apps/manent.png

          fpm -s dir -t deb -n manent -v "$VERSION" -a native \
            --description "Sync encrypted notes and files between devices via Nostr" \
            --url "https://github.com/dtonon/manent" \
            --depends libmpv2 --depends libsecret-1-0 \
            -p "manent-$VERSION-linux-x64.deb" -C pkg usr
          fpm -s dir -t rpm -n manent -v "$VERSION" -a native \
            --description "Sync encrypted notes and files between devices via Nostr" \
            --url "https://github.com/dtonon/manent" \
            --depends mpv-libs --depends libsecret \
            -p "manent-$VERSION-linux-x64.rpm" -C pkg usr

      - uses: actions/upload-artifact@v4
        with:
          name: manent-linux-x64
          path: manent-*-linux-x64.*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manent-linux-x64

      - uses: softprops/action-gh-release@v2
        with:
          files: manent-*-linux-x64.*
